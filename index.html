<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#8B6B4A" />
<title>Odaly — Odana Yeni Hayat</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon-192.png" type="image/png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <h1>Odaly</h1>
    <p class="subtitle">Odanı yükle, mevcut eşyalarınla en güzel düzeni gör.</p>
  </header>

  <main>
    <section class="card">
      <div class="card-header"><span class="step-num">1</span><h2>Oda</h2></div>
      <div class="tabs" id="sourceTabs">
        <button class="tab active" data-mode="photo">Fotoğraf</button>
        <button class="tab" data-mode="pano">360°</button>
        <button class="tab" data-mode="video">Video</button>
      </div>
      <label for="fileInput" class="upload-box" id="uploadBox">
        <div id="uploadHint" class="upload-hint">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
          <span id="uploadText">Fotoğraf Seç</span>
        </div>
        <canvas id="previewCanvas" hidden></canvas>
      </label>
      <input id="fileInput" type="file" accept="image/*" hidden />
      <input id="cameraInput" type="file" accept="image/*" capture="environment" hidden />
      <button id="cameraBtn" type="button" class="ghost">Kamerayla çek</button>
      <div id="sliderBox" class="slider-box" hidden>
        <label id="sliderLabel" for="viewSlider">Görünüm</label>
        <input id="viewSlider" type="range" min="0" max="100" value="0" />
      </div>
    </section>

    <section class="card">
      <div class="card-header"><span class="step-num">2</span><h2>Tarz</h2></div>
      <div id="styleGrid" class="style-grid"></div>
    </section>

    <section class="card">
      <div class="card-header"><span class="step-num">3</span><h2>Değişim</h2></div>
      <div class="tabs" id="strengthTabs">
        <button class="tab" data-s="0.45">Hafif</button>
        <button class="tab active" data-s="0.65">Dengeli</button>
        <button class="tab" data-s="0.85">Cesur</button>
      </div>
      <p class="hint">Hafif: eşyalar neredeyse aynı kalır. Cesur: yerleşim ve renkler çok değişir.</p>
    </section>

    <section class="action-section">
      <button id="generateBtn" class="primary btn-glow" disabled>
        <span>Tasarla</span>
      </button>
      <button id="clearBtn" type="button" class="ghost">Temizle</button>
      <p id="quotaText" class="hint" hidden></p>
      <button id="installBtn" class="ghost" hidden>Uygulamayı Yükle</button>
    </section>

    <section id="resultSection" class="card result-card" hidden>
      <div class="card-header"><h2>Sonuç</h2></div>
      <div id="loader" class="loader" hidden></div>
      <p id="statusText" class="hint" hidden></p>
      <p id="errorText" class="error" hidden></p>
      <div id="compare" class="compare" hidden>
        <img id="resultImage" alt="Yeni tasarım" />
        <img id="beforeImage" alt="Önce" />
        <input id="compareSlider" type="range" min="0" max="100" value="50" aria-label="Önce / sonra" />
      </div>
      <a id="downloadLink" class="download-btn" download="odaly-tasarim.jpg" hidden>İndir</a>
    </section>
  </main>

  <footer class="foot"><a href="gizlilik.html">Gizlilik</a> · <a href="sartlar.html">Şartlar</a></footer>

  <script src="config.js"></script>
  <script src="styles-catalog.js"></script>
  <script src="replicate.js"></script>
  <script src="app.js"></script>
</body>
</html>

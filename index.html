<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#8B6B4A" />
<title>İç Mimari AI — Odana Hayat Ver</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <h1>İç Mimari AI</h1>
    <p class="subtitle">Odanı fotoğrafla, tarzını seç, AI yeniden tasarlasın.</p>
  </header>

  <main>
    <section class="card">
      <div class="card-header">
        <span class="step-num">1</span>
        <h2>Oda Fotoğrafı</h2>
      </div>
      <label for="fileInput" class="upload-box" id="uploadBox">
        <div id="uploadHint" class="upload-hint">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
          <span>Fotoğraf Seç</span>
        </div>
        <img id="preview" alt="önizleme" hidden />
      </label>
      <input id="fileInput" type="file" accept="image/*" capture="environment" hidden />
    </section>

    <section class="card">
       <div class="card-header">
        <span class="step-num">2</span>
        <h2>Tarz Seç</h2>
      </div>
      <div id="styleGrid" class="style-grid"></div>
    </section>

    <section class="card">
       <div class="card-header">
        <span class="step-num">3</span>
        <h2>Ölçüler (opsiyonel)</h2>
      </div>
      <div class="measure-grid">
        <label>En (m)<input id="mWidth" type="number" step="0.1" min="1" placeholder="4.0"></label>
        <label>Boy (m)<input id="mLength" type="number" step="0.1" min="1" placeholder="5.0"></label>
        <label>Yükseklik (m)<input id="mHeight" type="number" step="0.1" min="2" placeholder="2.7"></label>
      </div>
    </section>

    <section class="action-section">
      <button id="generateBtn" class="primary btn-glow">
        <span>Tasarla</span>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
      </button>
    </section>

    <section id="resultSection" class="card result-card" hidden>
      <div class="card-header">
        <h2 id="resultTitle">Sonuç</h2>
      </div>
      <div id="loader" class="loader" hidden></div>
      <p id="errorText" class="error" hidden></p>
      <img id="resultImage" alt="AI sonucu" hidden />
      <a id="downloadLink" class="download-btn" download="tasarim.jpg" hidden>
        İndir
      </a>
    </section>
  </main>

  <script src="styles-catalog.js"></script>
  <script src="replicate.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js');
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#8B6B4A" />
<title>İç Mimari AI — Yerleşim Tasarımı</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon-192.png" type="image/png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <h1>İç Mimari AI</h1>
    <p class="subtitle">Oda fotoğrafını yükle, eşyalarını odanda yeniden yerleştir.</p>
  </header>

  <main>
    <section class="card">
      <div class="card-header">
        <span class="step-num">1</span>
        <h2>Oda Fotoğrafı</h2>
      </div>
      <label for="fileInput" class="upload-box" id="uploadBox">
        <div id="uploadHint" class="upload-hint">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
          <span>Fotoğraf Seç</span>
        </div>
      </label>
      <input id="fileInput" type="file" accept="image/*" capture="environment" hidden />
    </section>

    <!-- İnteraktif Tasarım Tuvali -->
    <section class="card canvas-card" id="canvasSection" hidden>
      <div class="card-header">
        <span class="step-num">2</span>
        <h2>Yerleşim & Düzenleme</h2>
      </div>
      <p class="hint">Eşyayı seçmek için üzerine dokun, parmağınla sürükleyerek yerini değiştir.</p>
      
      <div class="canvas-wrapper">
        <canvas id="roomCanvas"></canvas>
      </div>

      <div class="controls-grid">
        <button id="addFurnitureBtn" class="secondary-btn">➕ Eşya Ekle / Kes</button>
        <button id="autoLayoutBtn" class="secondary-btn">✨ Akıllı Yerleştir</button>
        <button id="clearBtn" class="ghost-btn">Temizle</button>
      </div>
    </section>

    <section class="action-section" id="actionSection" hidden>
      <button id="downloadCanvasBtn" class="primary btn-glow">
        <span>Tasarımı Kaydet</span>
      </button>
    </section>
  </main>

  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js');
    }
  </script>
</body>
</html>
